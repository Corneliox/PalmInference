<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Palm Inference Cam</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <h1 class="text-3xl font-bold mb-6 text-center">🔮 Palmistry Live Detection</h1>

  <div class="border-4 border-indigo-500 rounded-xl overflow-hidden shadow-lg">
    <img id="video-stream" src="" alt="Live Video Stream" class="w-full max-w-lg rounded"/>
  </div>

  <div class="flex gap-4 mt-4">
    <button onclick="startStream()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Start</button>
    <button onclick="stopStream()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Stop</button>
  </div>

  <button id="capture-btn" class="mt-6 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded shadow transition-all duration-200">
    📸 Jepret & Ramalan
  </button>
  <p class="mt-2 text-sm text-gray-400">Tekan tombol di atas untuk mengambil gambar dan mendapatkan ramalan.</p>

  <div id="result-area" class="mt-6 w-full max-w-lg bg-gray-800 p-4 rounded-lg shadow text-sm whitespace-pre-wrap hidden">
    <img id="result-img" class="mt-4 w-full rounded-lg" />
    <h2 class="text-lg font-semibold mb-2">🔍 Hasil Ramalan:</h2>
    <div id="ramalan-text" class="text-base leading-relaxed space-y-2 mb-4"></div>
    
    <button id="share-wa-btn" class="mt-4 w-full px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 flex items-center justify-center gap-2 hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" />
      </svg>
      Bagikan Hasil
    </button>
  </div>

<script>
    // --- Variabel Global ---
    const videoStream = document.getElementById('video-stream');
    const captureBtn = document.getElementById('capture-btn');
    const resultArea = document.getElementById('result-area');
    const resultText = document.getElementById('ramalan-text');
    const resultImg = document.getElementById('result-img');
    
    // BARU: Variabel tombol Share
    const shareBtn = document.getElementById('share-wa-btn');

    let isCooldown = false;

    // --- 1. Fungsi Kontrol Stream ---
    function startStream() {
      fetch('/start', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          console.log(data);
          videoStream.src = '/video_feed?' + new Date().getTime();
        });
    }

    function stopStream() {
      fetch('/stop', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          console.log(data);
          videoStream.src = '';
          // BARU: Sembunyikan juga area hasil saat stop
          resultArea.classList.add('hidden'); 
        });
    }

    // --- 3. Fungsi Capture Utama ---
    async function performCapture() {
      if (isCooldown) return; 
      isCooldown = true;
      console.log("Jepret dipicu...");

      try {
        const res = await fetch('/capture', { method: 'POST' });
        const data = await res.json();

        if (data.error) {
          resultText.innerHTML = `<span class="text-red-400">❌ Error: ${data.error}</span>`;
          resultImg.src = '';
          resultArea.classList.remove('hidden');
          // Sembunyikan tombol share jika error
          shareBtn.classList.add('hidden'); 
          return;
        }

        const { personality, image } = data;
        let html = '';

        if (personality.life && Array.isArray(personality.life)) {
          html += formatLine("🌱", "Life Line", personality.life);
        }
        if (personality.heart && Array.isArray(personality.heart)) {
          html += formatLine("💓", "Heart Line", personality.heart);
        }
        if (personality.head && Array.isArray(personality.head)) {
          html += formatLine("🧠", "Head Line", personality.head);
        }

        resultText.innerHTML = html;
        resultImg.src = 'data:image/jpeg;base64,' + image;
        resultArea.classList.remove('hidden');
        
        // BARU: Tampilkan tombol share jika berhasil
        shareBtn.classList.remove('hidden');

      } catch (err) {
        console.error("Proses capture gagal:", err);
        resultText.innerHTML = `<span class="text-red-400">❌ Error: ${err.message}</span>`;
        resultArea.classList.remove('hidden');
        shareBtn.classList.add('hidden');
      
      } finally {
        setTimeout(() => {
          isCooldown = false;
        }, 3000);
      }
    }

    // --- 4. Fungsi Helper Formatting ---
    function formatLine(titleEmoji, lineName, traitsArray) {
        let block = `<div class="mb-4 px-4 py-2 bg-gray-700 rounded-md text-white whitespace-pre-wrap font-mono text-sm">`;
        block += `${titleEmoji} ${lineName}\n`;
        traitsArray.forEach(trait => {
          block += `\t🔸 ${trait.result}\n\t  ${trait.explanation}\n\n`;
        });
        block += `</div>`;
        return block;
    }

    // --- BARU: Fungsi untuk Share ke WA ---
    async function shareResultToWA() {
      // 1. Cek apakah browser mendukung Web Share API
      if (!navigator.share) {
        alert("Browser Anda tidak mendukung fitur 'Share'. Coba di browser HP (Chrome/Safari).");
        return;
      }

      // Sembunyikan tombol share sementara untuk screenshot bersih
      shareBtn.classList.add('hidden');
      
      // 2. Ambil screenshot 'div' hasil
      const canvas = await html2canvas(document.getElementById('result-area'), {
          useCORS: true, // Untuk jaga-jaga jika ada gambar eksternal
          logging: false
      });
      
      // Tampilkan lagi tombolnya
      shareBtn.classList.remove('hidden');
      
      // 3. Konversi 'canvas' (screenshot) menjadi 'File'
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const file = new File([blob], 'ramalan.png', { type: 'image/png' });
      const filesArray = [file];
      
      const shareText = "Haloo.. Ini ramalan kamu hari ini";

      // 4. Panggil API Share bawaan OS
      try {
        if (!navigator.canShare({ files: filesArray })) {
            // Jika tidak bisa share file (misal di beberapa browser desktop)
            // Kita coba share teks-nya saja
            await navigator.share({
                title: 'Hasil Ramalan',
                text: shareText
            });
            alert("Browser tidak mendukung share gambar, hanya teks yang dibagikan.");
        } else {
            // Ini adalah skenario ideal (di HP)
            await navigator.share({
                files: filesArray,
                title: 'Hasil Ramalan',
                text: shareText
            });
        }
      } catch (err) {
        // Ini terjadi jika pengguna membatalkan 'share'
        console.log('Pengguna membatalkan share:', err.message);
      }
    }

    // --- 5. Event Listeners ---
    captureBtn.addEventListener('click', performCapture);
    
    // BARU: Event listener untuk tombol share
    shareBtn.addEventListener('click', shareResultToWA);

    document.addEventListener("keydown", function (event) {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault(); 
        performCapture();
      }
    });

</script>
</body>
</html>
